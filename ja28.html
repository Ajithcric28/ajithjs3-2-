<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Increment,Decrement Operator</title>
</head>
<body>
     <h1>Increment,Decrement Operator</h1>
     <script>
        var a = 5,b = 20;
        document.write("Result of " + a + " is = " + (a++) + "<br />");
        document.write("Result of " + a + " is = " + (++a) + "<br />");
        document.write("Result of " + a + " is = " + (a) + "<br />");
        document.write("Result of " + a + " is = " + (a-- ) + "<br />" );
        document.write("Result of " + a + " is = " + (--a ) + "<br />");
        document.write("Result of " + a + 'Equal to ' +  b +" is = " + (a) + "<br />");
     </script>
</body>
</html>
