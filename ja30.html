<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment Operators</title>
</head>
<body>
    <h1>Asssignment Operators</h1>
    <script>
        var a = 12, b = 4;
        var c=a+b;
        document.write("Result of " + a + " and " + b +" is = " + c + "<br/>");
        c+=a
        document.write("Result of " + a + " and " + b +" is = " + c + "<br/>");
        c-=a
        document.write("Result of " + a + " and " + b +" is = " + c + "<br/>");
        c*=a
        document.write("Result of " + a + " and " + b +" is = " + c + "<br/>");
        c/=a
        document.write("Result of " + a + " and " + b +" is = " + c + "<br/>");
        c%=2
        document.write("Result of " + a + " and " + b +" is = " + c + "<br/>");
    </script>
</body>
</html>
